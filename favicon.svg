<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner highlight -->
  <rect x="0" y="0" width="512" height="256" rx="112" fill="#FFFFFF" opacity="0.06"/>

  <!-- Monogram "Ar" from Arafat -->
  <text x="256" y="335" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="200" text-anchor="middle" fill="url(#letter)" letter-spacing="-4">Ar</text>
</svg>
